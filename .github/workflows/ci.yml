name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y neovim

      - name: Run tests
        run: |
          for f in tests/smoke_*.lua; do
            echo "=== $f ==="
            timeout 30 nvim --headless -u NONE -c "luafile $f"
          done
